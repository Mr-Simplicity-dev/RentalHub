<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentalHub NG - Under Maintenance</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 480px;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin-bottom: 1.5rem;
      border-radius: 16px;
    }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.75rem; color: #f8fafc; }
    p { font-size: 1rem; line-height: 1.6; color: #94a3b8; margin-bottom: 0.5rem; }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/rentalhub-mark.svg" alt="RentalHub NG" class="logo" onerror="this.style.display='none'">
    <h1>Brief pause — we'll be right back</h1>
    <p>We're deploying an update to improve your experience.</p>
    <p>This should only take a minute. Please refresh shortly.</p>
    <div class="badge">RentalHub NG</div>
  </div>
</body>
</html>
