# Include from nginx http context; review paths and certificates before applying.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=static:10m rate=100r/s;
map $http_user_agent $rentalhub_crawler { default 0; ~*(googlebot|bingbot|duckduckbot|slurp|baiduspider|yandex|facebookexternalhit|linkedinbot|twitterbot|whatsapp|rentalhubseoreview) 1; }
map $http_accept $rentalhub_json { default 0; ~*application/json 1; }
map "$rentalhub_crawler:$rentalhub_json" $rentalhub_seo_backend { default 0; ~1 1; }

# RentalHub — nginx production config
# Place in /etc/nginx/sites-available/rentalhub
# ln -s /etc/nginx/sites-available/rentalhub /etc/nginx/sites-enabled/

upstream rentalhub_backend {
  server 127.0.0.1:5000;
  keepalive 64;
}

server {
  listen 80;
  server_name rentalhub.com.ng www.rentalhub.com.ng;
  return 301 https://rentalhub.com.ng$request_uri;
}

server {
  listen 443 ssl http2;
  server_name rentalhub.com.ng;

  ssl_certificate /etc/letsencrypt/live/rentalhub.com.ng/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rentalhub.com.ng/privkey.pem;

  include /etc/nginx/snippets/public-app-downloads.conf;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Security headers
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;

  # Rate limiting

  # Upload limits
  client_max_body_size 50m;
  client_body_timeout 30s;

  # Static files — cache aggressively
  location /static/ {
    root /var/www/rentalhub/client/build;
    expires 1y;
    add_header Cache-Control "public, immutable";
    limit_req zone=static burst=200 nodelay;
  }

  # XML sitemap — MUST reach the backend, never the SPA fallback.
  # Previously the catch-all below served the React shell as "sitemap.xml",
  # so Google never received a real sitemap.
  location = /sitemap.xml {
    limit_req zone=api burst=10 nodelay;
    proxy_pass http://rentalhub_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/sitemap-[0-9]+\.xml$ {
    proxy_pass http://rentalhub_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location ~ ^/areas(?:/[^/]+){0,2}/?$ { return 404; }
  location ~ ^/(nigeria|areas)(/|$) {
    error_page 418 = @rentalhub_seo;
    if ($rentalhub_seo_backend) { return 418; }
    root /var/www/rentalhub/client/build;
    try_files $uri $uri/ /index.html;
  }
  location @rentalhub_seo {
    proxy_pass http://rentalhub_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location ~ ^/(blog/|properties/[0-9]+/?$) {
    proxy_pass http://rentalhub_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # OAuth authorization codes must not appear in access logs.
  location = /api/admin/seo/google/callback {
    access_log off;
    proxy_pass http://rentalhub_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /robots.txt {
    root /var/www/rentalhub/client/build;
    try_files $uri =404;
  }

  location ~ ^/(admin|super-admin|tenant(-dashboard)?|landlord(-dashboard)?|agent-dashboard|dashboard|profile|messages|wallet|notifications|settings|login|register)(/|$) {
    root /var/www/rentalhub/client/build;
    try_files /index.html =404;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
    add_header Cache-Control "no-store" always;
  }
  location / {
    root /var/www/rentalhub/client/build;
    try_files $uri $uri/ /index.html;
    expires -1;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # API proxy
  location /api/ {
    limit_req zone=api burst=50 nodelay;
    proxy_pass http://rentalhub_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffering off;
  }

  # Twilio voice webhooks + admin voice-token endpoint.
  # Twilio signs requests over the full public URL (TWILIO_WEBHOOK_BASE_URL),
  # so this must reach Express untouched — same settings as the API proxy.
  location /voice/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://rentalhub_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffering off;
  }

  # Socket.io
  location /socket.io/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://rentalhub_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
  }

  # Uploads — ONLY the public ad-spaces subdirectory may be served directly.
  # Everything else (passports, disputes, tickets) is identity documents and
  # evidence — it must ONLY be served through authenticated API routes.
  # DO NOT point this location at the whole uploads/ directory.
  location /uploads/ad-spaces/ {
    alias /var/www/rentalhub/uploads/ad-spaces/;
    expires 1d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff;
    limit_req zone=static burst=100 nodelay;
  }

  location ~* \.map$ { return 404; }

  # Explicitly block everything else under /uploads/ at the proxy layer.
  location /uploads/ {
    return 403;
  }
}

server {
  listen 443 ssl;
  server_name www.rentalhub.com.ng;
  ssl_certificate /etc/letsencrypt/live/rentalhub.com.ng/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rentalhub.com.ng/privkey.pem;
  return 301 https://rentalhub.com.ng$request_uri;
}
